databaseChangeLog:
  - changeSet:
      id: implementation outbox pattern
      author: Dmitry Bush
      changes:
        - createTable:
            tableName: metadata_outbox
            columns:
              - column:
                  name: operation_id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: table_name
                  type: VARCHAR(63)
                  constraints:
                    nullable: false
              - column:
                  name: operation
                  type: VARCHAR(1)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false