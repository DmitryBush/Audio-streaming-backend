spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/metadata_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties.hibernate:
      show_sql: true
      format_sql: true
      hbm2ddl.auto: validate
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

logging:
  level:
    ohio:
      rizz:
        streamingservice: DEBUG

server:
  port: 8080

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

eureka:
  client:
    enabled: false

storage-service:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin