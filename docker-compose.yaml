services:
    # Key-value database
    redis:
        image: redis:8.2-alpine
        restart: always
        command: redis-server --save 60 1 --loglevel warning
        ports:
          - "6379:6379"
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 30s
          timeout: 5s
          retries: 5
          start_period: 5s
        volumes:
          - redis_data:/data

    # Object-relational database
    postgres:
        image: postgres:18.0-alpine
        restart: always
        environment:
          - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES}
        ports:
          - "5432:5432"
        healthcheck:
          test: ["CMD", "pg_isready -U $${POSTGRES_USERNAME} -d $${POSTGRES_DB}"]
          interval: 30s
          timeout: 5s
          retries: 5
          start_period: 5s
        command: ["postgres", "-c", "wal_level=logical"]
        volumes:
          - db_data:/var/lib/postgresql
          - ./InitScripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql

    # Simple Storage Service (S3)
    minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        restart: always
        command: server /data
        ports:
          - "9000:9000"
        healthcheck:
          test: ["CMD", "mc", "ready", "local"]
          interval: 30s
          timeout: 5s
          retries: 5
          start_period: 5s
        volumes:
          - storage_data:/data

    # Elasticsearch
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.2.3
        restart: always
        environment:
          - discovery.type=single-node
          - bootstrap.memory_lock=true
          - xpack.security.enabled=true
          - xpack.security.http.ssl.enabled=false
          - ES_JAVA_OPTS=-Xms512m -Xmx512m
          - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
        healthcheck:
          test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
          interval: 30s       
          timeout: 10s         
          retries: 5          
          start_period: 1m10s
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
            memlock:
                soft: -1
                hard: -1
        ports:
          - "9200:9200"
        volumes:
          - elastic_search_data:/usr/share/elasticsearch/data

    # Audio streaming microservices
    user-service:
        image: sound-flow-user-service:latest
        restart: always
        environment:
          - SECRET_SIGNING_KEY=${SECRET_SIGNING_KEY}
          - POSTGRES_USER_JDBC_URL=${POSTGRES_USER_JDBC_URL}
          - POSTGRES_PLAYLIST_JDBC_URL=${POSTGRES_PLAYLIST_JDBC_URL}
          - POSTGRES_USERNAME=${POSTGRES_USERNAME}
          - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          - REDIS_HOST=${REDIS_HOST}
          - REDIS_PORT=${REDIS_PORT}
        healthcheck:
          test: ["CMD", "wget", "--no-verbose", "--spider", "--tries=1", "http://localhost:8080/actuator/health"]
          interval: 1m30s
          timeout: 10s
          retries: 5
          start_period: 25s
        depends_on:
          - postgres
          - redis
        ports:
          - 8081:8080

volumes:
  db_data:
  redis_data:
  storage_data:
  elastic_search_data: